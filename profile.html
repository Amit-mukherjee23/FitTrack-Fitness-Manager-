<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - FitTrack</title>

    <script>
    const profile = localStorage.getItem("fitTrackProfile");

    if (!profile) {
        window.location.href = "setup.html";
    }
</script>

    <link rel="stylesheet" href="css/style.css">


</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            FitTrack
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="workout.html">
                Workout
            </a>

            <a href="progress.html">
                Progress
            </a>

            <a href="goals.html">
                Goals
            </a>

            <a href="profile.html" class="active">
                Profile
            </a>

        </div>

    </nav>



    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">

        <h1>
            My Profile 👤
        </h1>

        <p>
            Manage your fitness profile and personal information.
        </p>

    </section>



    <!-- ================= PROFILE ================= -->

    <main class="profile-container">


        <!-- Profile Information -->

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <h2 id="profileDisplayName">
                
            </h2>

            <p id="profileDisplayGoal">
                Fitness Journey
            </p>


            <div class="profile-stats">

                <div class="profile-stat">

                    <strong id="profileTotalWorkouts">
                        0
                    </strong>

                    <span>
                        Workouts
                    </span>

                </div>


                <div class="profile-stat">

                    <strong id="profileTotalCalories">
                        0
                    </strong>

                    <span>
                        Calories
                    </span>

                </div>


                <div class="profile-stat">

                    <strong id="profileWeight">
                        --
                    </strong>

                    <span>
                        Weight
                    </span>

                </div>

            </div>

        </section>



        <!-- Edit Profile -->

        <section class="profile-form-card">

            <h2>
                Profile Information
            </h2>

            <p class="form-description">
                Update your information below.
            </p>


            <form id="profileForm">


                <!-- Name -->

                <div class="form-group">

                    <label for="profileName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="profileName"
                        placeholder="Enter your name"
                        required
                    >

                </div>





                <!-- Fitness Goal -->

                <div class="form-group">

                    <label for="fitnessGoal">
                        Fitness Goal
                    </label>

                    <select id="fitnessGoal">

                        <option value="Build Strength">
                            Build Strength
                        </option>

                        <option value="Stay Consistent">
                            Stay Consistent
                        </option>

                        <option value="Improve Fitness">
                            Improve Fitness
                        </option>

                        <option value="General Health">
                            General Health
                        </option>

                    </select>

                </div>



                <!-- Weight -->

                <div class="form-group">

                    <label for="profileWeightInput">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="profileWeightInput"
                        placeholder="Enter weight"
                        min="1"
                        step="0.1"
                    >

                </div>



                <!-- Save -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Profile
                </button>

               <button
    type="button"
    id="resetProfileBtn"
    class="reset-profile-btn"
>
    🔄 Reset Profile
</button> 


                <p
                    id="profileMessage"
                    class="profile-message"
                >
                </p>


            </form>

        </section>



    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            Stay Healthy. Stay Strong.
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/profile.js"></script>


</body>

</html>
