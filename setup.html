<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitTrack - Create Profile</title>

    <link rel="stylesheet" href="css/style.css">
    

</head>

<body>

    <main class="setup-container">

        <div class="setup-card">

            <div class="setup-icon">
                💪
            </div>

            <h1>Welcome to FitTrack!</h1>

            <p>
                Create your profile to get started.
            </p>


            <form id="setupForm">

                <label for="setupName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="setupName"
                    placeholder="Enter your name"
                    required
                >



                <label for="setupGoal">
                    Fitness Goal
                </label>

                <select id="setupGoal">

                    <option value="Build Strength">
                        Build Strength
                    </option>

                    <option value="Lose Weight">
                        Lose Weight
                    </option>

                    <option value="Stay Fit">
                        Stay Fit
                    </option>

                    <option value="Improve Endurance">
                        Improve Endurance
                    </option>

                </select>


                <label for="setupWeight">
                    Current Weight (kg)
                </label>

                <input
                    type="number"
                    id="setupWeight"
                    placeholder="Enter your weight"
                    step="0.1"
                >


                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Profile
                </button>

            </form>

        </div>

    </main>


    <script src="js/setup.js"></script>

</body>

</html>
